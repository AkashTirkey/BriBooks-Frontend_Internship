<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>

<body>
    <form action="#">
        <h1>Contact Form</h1>
        <p>Personal Information</p>
        <hr>
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="" placeholder="Enter first name" required>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" placeholder="Enter last name" required> <br>

        <label for="address">Street Address:</label>
        <input type="text" id="address" placeholder="address here..." required>

        <label for="address2">Address Line 2:</label>
        <input type="text" id="address2" placeholder="address here..." required> <br>

        <label for="city">City</label>
        <input type="text" id="city" placeholder="Enter City here"> <br>

        <label for="zip">Zip Code:</label>
        <input inputmode="numeric" id="zip" placeholder="12345" required>

        <fieldset>
            <legend>Contact Details</legend>
            <label for="e-address">Email Address</label>
            <input type="email" placeholder="Enter Email here.." id="e-address">
            <label for="pnumber">Contact Number</label>
            <input type="tel" id="pnumber">
            <h2>Ask your question</h2>
            <textarea name="query" id="" rows="10px" cols="50px" placeholder="query here...."></textarea> <br>
            <button>submit</button>
        </fieldset>
    </form>

</body>

</html>
