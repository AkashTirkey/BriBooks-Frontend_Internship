<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>flexbox Layout</title>
</head>

<body>
    <div class="container">
        <div class="left">
            <h3>Left</h3>
            <p>Home</p>
            <p>About</p>
            <p>Section</p>
        </div>
        <div class="main">
            <h3>Main</h3>
            <section>
                <h4>Section 1</h4>
                <h4>Section 2</h4>
                <h4>Section 3</h4>
            </section>
        </div>
        <div class="right">
            <h3>Right</h3>
            <aside>
                <p>Line 1</p>
                <p>Line 2</p>
                <p>Line 3</p>
            </aside>
        </div>
    </div>
</body>

</html>
